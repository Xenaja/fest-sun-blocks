<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новогодняя Мистерия для партнёров – лендинг на блоках</title>
  <style>
    body { margin: 0; background: #e8e8e8; }
    .demo-label { max-width: 1100px; margin: 0 auto; padding: 10px 16px; font: 12px/1.4 monospace; color: #555; }
    .demo-label b { color: #1f1f1f; }
  </style>
</head>
<body>
  <div class="demo-label"><b>soundmystery.ru/newyear_fe</b> – страница для партнёров: те же блоки, что на newyear.html, плюс invite</div>

  <div class="demo-label"><b>text · program</b></div>

  <div class="demo-label"><b>text · invite</b> – «Приглашайте на Мистерию новичков» · data-audience="partner"</div>

  <div class="demo-label"><b>text · community</b> – «Клуб осознанных миллионеров-долгожителей» · data-audience="partner"</div>
  <div class="fs-block" data-block="text" data-name="community" data-event="novogodnyaya-misteriya" data-audience="partner" data-variant="soft"></div>

  <script src="fs.js"></script>
